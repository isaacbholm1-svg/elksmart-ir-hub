# XcodeGen spec for the 3D Scanner app. GitHub Actions turns this into an Xcode
# project and builds an unsigned Scanner3D.ipa (see .github/workflows/scanner.yml)
# that you sign and install with KSign. Info.plist is generated from `info` below.
name: Scanner3D
options:
  bundleIdPrefix: io.github.scanner3d
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scanner3D:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.scanner3d.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 3D Scanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera and LiDAR scanner are used to capture objects and rooms in 3D.
        NSPhotoLibraryAddUsageDescription: Lets you save floor plans and photos to your library.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}
